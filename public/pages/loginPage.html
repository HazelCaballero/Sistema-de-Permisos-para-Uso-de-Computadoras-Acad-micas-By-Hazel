<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css"> <!-- Asegúrate de agregar tu archivo CSS -->
</head>
<body>
    <header>
        <h1>Iniciar sesión</h1>
    </header>
    <main>
        <div class="loginAccount">
            <h2>Iniciar sesión como administrador</h2>
            <input type="text" id="loginAdminId" placeholder="ID de Usuario" required>
            <input type="password" id="loginAdminPassword" placeholder="Contraseña" required>
            <button class="btnLogin" id="btnLoginAdmin">Iniciar</button>
            <a href="mainPageAdmin.html" id="linkMainPageAdmin">Ir a Main Page</a>
        </div>
        <div class="loginAccount" id="loginUser">
            <h2>Iniciar sesión como Solicitante</h2>
            <input type="text" id="loginUserId" placeholder="ID de Usuario" required>
            <input type="password" id="loginUserPassword" placeholder="Contraseña" required>
            <button class="btnLogin" id="btnLoginUser">Iniciar</button>
            <a href="mainPageUsers.html" id="linkMainPageUsers">Ir a Main Page</a>
        </div>
    </main>
    <script type="module" src="loginPage.js"></script>
</body>
</html>
