<!DOCTYPE html>
<html lang="es">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page Administrator</title>
    <link rel="stylesheet" href="../styles/mainPageAdmin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Lexend:wght@100..900&family=Matemasie&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="globalContainer">
        <header class="headerContainer">
            <div class="header1"><h1>Solicitudes</h1></div>
            <div class="header2"><h2 id="adminName">Administrador</h2></div>
            <div class="header3">
                <a href="staticsAndSearch.html" id="linkStaticsAndSearch">
                    <h2>Estadísticas detalladas y buscador de solicitudes</h2>
                </a>
            </div>
        </header>

        <main>
            <h3>Solicitudes pendientes</h3>
            <section id="pendingRequestsSection">
                
                <ul id="pendingRequestsList">
                    <!-- Ejemplo de solicitud -->
                    <li>
                        <div class="requestDetails">
                            
                        </div>
                        <div class="requestButtons">
                            <button class="approveBtn">Aprobar</button>
                            <button class="denyBtn">Denegar</button>
                        </div>
                    </li>
                </ul>
            </section>

            <!-- Historial de solicitudes -->
            <section id="searchAndHistory">
                <div id="historySection">
                    <div id="currentAdminRequests">
                        <h5>Solicitudes revisadas por administrador actual</h5>
                        <ul id="currentAdminList"></ul>
                    </div>
                    <div id="otherAdminsRequests">
                        <h5>Solicitudes revisadas por otros administradores</h5>
                        <ul id="otherAdminList"></ul>
                    </div>
                </div>
            </section>

            <!-- Sección de estadísticas -->
            <section id="statisticsContainer" hidden>
                <h3>Estadísticas</h3>
                <div id="staticsContainer">
                    <p id="totalRequests">Total de solicitudes: 0</p>
                    <ul id="requestsPerStudent"></ul>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="../js/mainPageAdmin.js"></script>
</body>
</html>
